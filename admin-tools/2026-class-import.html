<!--
  One-off admin tool used 2026-09-11 to import the 2026-2027 English
  Department class roster into Vanilla. Import is complete — this file is
  kept for reference only (the embedded TARGET_CLASSES list documents
  exactly which classes/teachers/subject-grades were created and why).
  Not wired into the client build; not served by the live app. To reuse
  this pattern for a future import, copy it and update TARGET_CLASSES —
  don't run this one again as-is, since it will just show everything as
  already imported.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanilla — 2026 Class Import</title>
<style>
/* ── Self-hosted fonts (served by this same origin) ─────────────────────── */
@font-face {
  font-family: 'Pacifico';
  src: url('/fonts/Pacifico-Regular.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Fredoka';
  src: url('/fonts/Fredoka-Variable.woff2') format('woff2');
  font-weight: 300 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Nunito';
  src: url('/fonts/Nunito-Variable.woff2') format('woff2');
  font-weight: 200 900; font-style: normal; font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-vanilla:    #FFFDD0;
  --color-pistachio:  #F5F5DC;
  --color-peach:      #FAEBD7;
  --color-mango:      #FFE4C4;
  --color-cornsilk:   #FFF8DC;
  --color-text:       #4A3728;
  --color-text-muted: #7A5C4A;
  --color-accent:     #E8698A;
  --color-accent-hover: #D4547A;
  --color-accent-alt: #6BAF92;
  --color-border:     #E8D5C0;
  --color-bg:       var(--color-cornsilk);
  --color-surface:  #FAFAF8;
  --color-primary:  var(--color-accent);
  --color-danger:       #C45C3A;
  --color-danger-hover: #A84D2F;
  --color-success:  var(--color-accent-alt);
  --color-warning:  #D4900A;
  --color-warning-text: #7A4F00;
  --color-info:     #5B9BD5;
  --font-display: 'Pacifico', cursive;
  --font-heading: 'Fredoka', sans-serif;
  --font-body:    'Nunito', sans-serif;
  --text-xs:   0.75rem;
  --text-sm:   0.875rem;
  --text-base: 1rem;
  --text-lg:   1.125rem;
  --text-xl:   1.25rem;
  --text-2xl:  1.5rem;
  --radius:    1rem;
  --radius-sm: 0.5rem;
  --radius-pill: 9999px;
  --shadow:    0 4px 20px rgba(74, 55, 40, 0.1);
  --shadow-sm: 0 2px 8px rgba(74, 55, 40, 0.08);
  font-size: 16px;
}

body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
}

h1, h2, h3 { font-family: var(--font-heading); font-weight: 600; }

.app-main { max-width: 1000px; margin: 0 auto; padding: 28px 24px 80px; }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }
.page-title { font-family: var(--font-heading); font-size: var(--text-2xl); font-weight: 700; }
.page-sub { color: var(--color-text-muted); font-size: var(--text-sm); margin-bottom: 24px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 20px; border: none; border-radius: var(--radius-pill); cursor: pointer;
  font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
  transition: background 0.15s, opacity 0.15s, transform 0.1s; white-space: nowrap;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn:not(:disabled):active { transform: scale(0.97); }
.btn-primary { background: var(--color-accent); color: var(--color-vanilla); }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-hover); }
.btn-secondary { background: var(--color-mango); color: var(--color-text); }
.btn-secondary:hover:not(:disabled) { background: var(--color-peach); }
.btn-ghost { background: transparent; border: 1.5px solid var(--color-accent); color: var(--color-accent); }
.btn-ghost:hover:not(:disabled) { background: rgba(232, 105, 138, 0.08); }
.btn-danger { background: var(--color-danger); color: var(--color-vanilla); }
.btn-danger:hover:not(:disabled) { background: var(--color-danger-hover); }
.btn-sm { padding: 4px 14px; font-size: var(--text-xs); }

.form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
.form-label { font-size: var(--text-sm); font-weight: 500; }
.form-input {
  padding: 8px 14px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  font-size: var(--text-base); width: 100%; background: var(--color-surface); color: var(--color-text);
  transition: border-color 0.15s;
}
.form-input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(232, 105, 138, 0.15); }
.form-error { color: var(--color-accent); font-size: var(--text-xs); }

.card { background: var(--color-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }

.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.table th {
  text-align: left; padding: 10px 14px; font-family: var(--font-heading); font-weight: 600;
  border-bottom: 2px solid var(--color-border); color: var(--color-text-muted);
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.5px;
}
.table td { padding: 10px 14px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.table tbody tr:hover { background: var(--color-cornsilk); }
.table-empty { text-align: center; color: var(--color-text-muted); padding: 32px !important; }
.table-scroll { overflow-x: auto; }

.badge {
  display: inline-block; padding: 2px 10px; border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 500; font-family: var(--font-heading);
}
.badge-blue   { background: #D6EAF8; color: #1A5276; }
.badge-green  { background: #D5F5E3; color: #1E8449; }
.badge-red    { background: #FADBD8; color: #922B21; }
.badge-yellow { background: var(--color-mango); color: #7A4F00; }
.badge-gray   { background: var(--color-pistachio); color: var(--color-text-muted); }

.alert { padding: 12px 16px; border-radius: var(--radius-sm); font-size: var(--text-sm); margin-bottom: 16px; }
.alert-danger  { background: #FADBD8; color: #922B21; border: 1.5px solid #F1948A; }
.alert-success { background: #D5F5E3; color: #1E8449; border: 1.5px solid #82E0AA; }
.alert-warning { background: var(--color-mango); color: #7A4F00; border: 1.5px solid #F0B27A; }
.alert-info    { background: #D6EAF8; color: #1A5276; border: 1.5px solid #85C1E9; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--color-border); margin-bottom: 20px; overflow-x: auto; }
.tab {
  padding: 8px 18px; border: none; background: none; cursor: pointer; font-family: var(--font-heading);
  font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted);
  border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.15s; white-space: nowrap;
}
.tab:hover { color: var(--color-text); }
.tab.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(74, 55, 40, 0.35);
  display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
}
.modal {
  background: var(--color-surface); border-radius: var(--radius); padding: 28px;
  max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(74, 55, 40, 0.2);
}
.modal-title { font-family: var(--font-heading); font-size: var(--text-xl); font-weight: 700; margin-bottom: 16px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

.spinner {
  width: 32px; height: 32px; border: 3px solid var(--color-border); border-top-color: var(--color-accent);
  border-radius: 50%; animation: spin 0.6s linear infinite; margin: 40px auto; display: block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-center { display: flex; justify-content: center; align-items: center; padding: 60px; flex-direction: column; gap: 12px; }

.import-queue-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
  margin-bottom: 8px; background: var(--color-surface);
}
.import-queue-item.done { opacity: 0.55; }
.import-queue-item .info { display: flex; flex-direction: column; gap: 2px; }
.import-queue-item .name { font-family: var(--font-heading); font-weight: 600; }
.import-queue-item .meta { font-size: var(--text-xs); color: var(--color-text-muted); }
.import-queue-item .actions { display: flex; gap: 8px; flex-shrink: 0; }

#login-screen { max-width: 380px; margin: 80px auto; }
</style>
</head>
<body>

<div id="app" class="app-main">Loading…</div>

<script>
const API_BASE = '/api';

// ── Complete target class list, derived from the 2026-2027 English Dept

  { code: 'HXESL', section: 2, teacherName: 'Karl Al-Omar', sgName: 'House X ESL - co 2030', className: 'HX ESL 2' },
  { code: 'HXESL', section: 3, teacherName: 'Dan Wu', sgName: 'House X ESL - co 2030', className: 'HX ESL 3' },
  { code: 'HXESL', section: 4, teacherName: 'Amanda Huang', sgName: 'House X ESL - co 2030', className: 'HX ESL 4' },
  { code: '10AENG', section: 1, teacherName: 'Tiffany Chen Xi 陈曦', sgName: 'G10 AE - co 2029', className: '10AENG 1' },
  { code: '10AENG', section: 2, teacherName: 'Tiffany Chen Xi 陈曦', sgName: 'G10 AE - co 2029', className: '10AENG 2' },

  { code: '10AENG', section: 9, teacherName: 'Amanda Huang', sgName: 'G10 AE - co 2029', className: '10AENG 9' },
  { code: '10EFL', section: 1, teacherName: 'Reuben Tang', sgName: 'G10 EFL - co 2029', className: 'G10 EFL 1' },
  { code: '10EFL', section: 2, teacherName: 'Jonathan NG', sgName: 'G10 EFL - co 2029', className: 'G10 EFL 2' },
  { code: '10ESL', section: 1, teacherName: 'Dean Mekwan', sgName: 'G10 ESL - co 2029', className: '10ESL 1' },
  { code: '10ESL', section: 2, teacherName: 'Dean Mekwan', sgName: 'G10 ESL - co 2029', className: '10ESL 2' },
  { code: '10ESL', section: 3, teacherName: 'Jocelyn Yu', sgName: 'G10 ESL - co 2029', className: '10ESL 3' },
  { code: '10ESL', section: 4, teacherName: 'Jocelyn Yu', sgName: 'G10 ESL - co 2029', className: '10ESL 4' },
  { code: '10ESL', section: 5, teacherName: 'Miranda Li', sgName: 'G10 ESL - co 2029', className: '10ESL 5' },
  { code: '10ESL HONOR', section: 1, teacherName: 'Jonathan NG', sgName: 'G10 ESL Honors - co 2029', className: '10ESL-HONOR 1' },
  { code: '10ESL HONOR', section: 2, teacherName: 'Dean Mekwan', sgName: 'G10 ESL Honors - co 2029', className: '10ESL-HONOR 2' },
  { code: '11AL ENG', section: null, teacherName: 'Dan Wu', sgName: 'G11 A-Levels English - co 2028', className: 'G11 A-Levels' },
  { code: '11ENG ALL HL', section: null, teacherName: 'Brittany Johnston', sgName: 'G11 Eng A HL - co 2028', className: 'G11 EngA HL' },
  { code: '11ENG ALL SL', section: null, teacherName: 'Devin Jones', sgName: 'G11 Eng A SL - co 2028', className: 'G11 EngA SL' },
  { code: '11ENG B HL', section: 1, teacherName: 'Nathan Paine', sgName: 'G11 Eng B HL - co 2028', className: 'G11 EngB HL 1' },
  { code: '11ENG B HL', section: 2, teacherName: 'Reuben Tang', sgName: 'G11 Eng B HL - co 2028', className: 'G11 EngB HL 2' },
  { code: '11ENG B HL', section: 3, teacherName: 'John Pasden', sgName: 'G11 Eng B HL - co 2028', className: 'G11 EngB HL 3' },
  { code: '11ENG B HL', section: 4, teacherName: 'Reuben Tang', sgName: 'G11 Eng B HL - co 2028', className: 'G11 EngB HL 4' },
  { code: '11ENG B HL', section: 5, teacherName: 'Tiffany Chen Xi 陈曦', sgName: 'G11 Eng B HL - co 2028', className: 'G11 EngB HL 5' },
  { code: '11ENG B HL', section: 6, teacherName: 'Reuben Tang', sgName: 'G11 Eng B HL - co 2028', className: 'G11 EngB HL 6' },
  { code: '11ENG B SL', section: null, teacherName: 'John Pasden', sgName: 'G11 Eng B SL - co 2028', className: '11EngB SL' },
  { code: '12AL ENG', section: null, teacherName: 'Dan Wu', sgName: 'G12 A-Levels English - co 2027', className: 'G12 A-Levels' },
  { code: '12ENG ALL HL', section: null, teacherName: 'Devin Jones', sgName: 'G12 Eng A HL - co 2027', className: 'G12 EngA HL' },
  { code: '12ENG ALL SL', section: null, teacherName: 'Brittany Johnston', sgName: 'G12 Eng A SL - co 2027', className: 'G12 EngA SL' },
  { code: '12ENG B HL', section: 1, teacherName: 'Jonathan NG', sgName: 'G12 Eng B HL - co 2027', className: 'G12 EngB HL 1' },
  { code: '12ENG B HL', section: 2, teacherName: 'Nathan Paine', sgName: 'G12 Eng B HL - co 2027', className: 'G12 EngB HL 2' },
  { code: '12ENG B HL', section: 3, teacherName: 'Brittany Johnston', sgName: 'G12 Eng B HL - co 2027', className: 'G12 EngB HL 3' },
  { code: '12ENG B HL', section: 4, teacherName: 'Nathan Paine', sgName: 'G12 Eng B HL - co 2027', className: 'G12 EngB HL 4' },
  { code: '12ENG B HL', section: 5, teacherName: 'Devin Jones', sgName: 'G12 Eng B HL - co 2027', className: 'G12 EngB HL 5' },
  { code: '12ENG B HL', section: 6, teacherName: 'Devin Jones', sgName: 'G12 Eng B HL - co 2027', className: 'G12 EngB HL 6' },
  { code: '12ENG B SL', section: null, teacherName: 'John Pasden', sgName: 'G12 Eng B SL - co 2027', className: '12EngB SL' },
  { code: 'JPN ABI', section: null, teacherName: 'Nathan Paine', sgName: 'G12 JPN ABI - co 2027', className: 'G12 JPN ABI', isNewSubjectGrade: true, departmentName: 'QD English Department' },
];

const app = document.getElementById('app');
let state = {
  user: null,
  classes: [],
  subjectGrades: [],
  teachers: [],
  departments: [],
};

function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) {
    throw new Error((body && body.error) || `Request failed: ${res.status}`);
  }
  return body;
}

async function loadAll() {
  const [classes, subjectGrades, teachers, departments] = await Promise.all([
    api('/admin/classes'),
    api('/admin/subject-grades'),
    api('/admin/teachers'),
    api('/admin/departments'),
  ]);
  state.classes = classes;
  state.subjectGrades = subjectGrades;
  state.teachers = teachers;
  state.departments = departments;
}

function findTeacherByName(name) {
  return state.teachers.find(t => t.user && t.user.name === name);
}
function findSubjectGradeByName(name) {
  return state.subjectGrades.find(sg => sg.name === name);
}
function findExistingClass(className, teacherId, subjectGradeId) {
  return state.classes.find(c =>
    c.name === className &&
    c.teacher && c.teacher.id === teacherId &&
    c.subjectGrade && c.subjectGrade.id === subjectGradeId &&
    !c.archivedAt,
  );
}

function classify() {
  const resolved = TARGET_CLASSES.map(t => {
    const teacher = findTeacherByName(t.teacherName);
    const sg = t.isNewSubjectGrade ? findSubjectGradeByName(t.sgName) : findSubjectGradeByName(t.sgName);
    const existing = teacher && sg ? findExistingClass(t.className, teacher.id, sg.id) : null;
    return { ...t, teacher, sg, existing };
  });
  const existingRows = resolved.filter(r => r.existing);
  const pendingRows = resolved.filter(r => !r.existing);
  return { existingRows, pendingRows };
}

function render() {
  const { existingRows, pendingRows } = classify();

  app.innerHTML = '';
  app.appendChild(h(`
    <div>
      <div class="page-header">
        <div>
          <div class="page-title">2026 Class Import</div>
          <div class="page-sub">Logged in as ${esc(state.user.name)} (${esc(state.user.email)}) &middot; source: 2026-2027 English Dept sections</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Log out</button>
      </div>
    </div>
  `));

  app.appendChild(h(`
    <div class="alert alert-info">
      Already imported: <strong>${existingRows.length}</strong> &middot;
      Not yet imported: <strong>${pendingRows.length}</strong> &middot;
      Total target classes: <strong>${TARGET_CLASSES.length}</strong>
    </div>
  `));

  // ── Already-imported table ──────────────────────────────────────────
  const existingCard = h(`
    <div class="card">
      <h2 style="margin-bottom: 12px;">Already imported (${existingRows.length})</h2>
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr><th>Class</th><th>Subject Grade</th><th>Teacher</th><th>Students</th><th>Assignments</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  `);
  const existingTbody = existingCard.querySelector('tbody');
  if (existingRows.length === 0) {
    existingTbody.appendChild(h(`<tr><td class="table-empty" colspan="5">None imported yet.</td></tr>`));
  } else {
    for (const r of existingRows) {
      existingTbody.appendChild(h(`
        <tr>
          <td><strong>${esc(r.existing.name)}</strong></td>
          <td>${esc(r.sg.name)}</td>
          <td>${esc(r.teacher.user.name)}</td>
          <td>${r.existing._count ? r.existing._count.enrollments : '—'}</td>
          <td>${r.existing._count ? r.existing._count.assignments : '—'}</td>
        </tr>
      `));
    }
  }
  app.appendChild(existingCard);

  // ── Not-yet-imported queue ──────────────────────────────────────────
  const pendingCard = h(`
    <div class="card">
      <h2 style="margin-bottom: 4px;">Not yet imported (${pendingRows.length})</h2>
      <div class="page-sub" style="margin-bottom: 16px;">Review and import one at a time. Nothing is created until you click Import on that row.</div>
      <div id="pending-list"></div>
    </div>
  `);
  const pendingList = pendingCard.querySelector('#pending-list');
  if (pendingRows.length === 0) {
    pendingList.appendChild(h(`<div class="alert alert-success">All target classes have been imported. Nothing left to do.</div>`));
  } else {
    for (const r of pendingRows) {
      const teacherOk = !!r.teacher;
      const sgOk = !!r.sg || r.isNewSubjectGrade;
      const item = h(`
        <div class="import-queue-item">
          <div class="info">
            <div class="name">${esc(r.className)}</div>
            <div class="meta">
              ${esc(r.sgName)}${r.isNewSubjectGrade && !r.sg ? ' <span class="badge badge-yellow">will be created</span>' : ''}
              &middot; ${esc(r.teacherName)}${!teacherOk ? ' <span class="badge badge-red">teacher not found</span>' : ''}
              &middot; source: ${esc(r.code)}${r.section ? ' ' + r.section : ''}
            </div>
          </div>
          <div class="actions">
            <button class="btn btn-primary btn-sm import-one-btn" ${(!teacherOk || !sgOk && !r.isNewSubjectGrade) ? 'disabled' : ''}>Import</button>
          </div>
        </div>
      `);
      item.querySelector('.import-one-btn').addEventListener('click', () => importOne(r, item));
      pendingList.appendChild(item);
    }
  }
  app.appendChild(pendingCard);
}

async function importOne(row, itemEl) {
  const btn = itemEl.querySelector('.import-one-btn');
  btn.disabled = true;
  btn.textContent = 'Importing…';
  try {
    let sg = row.sg;
    if (!sg && row.isNewSubjectGrade) {
      const dept = state.departments.find(d => d.name === row.departmentName);
      if (!dept) throw new Error(`Department "${row.departmentName}" not found`);
      sg = await api('/admin/subject-grades', {
        method: 'POST',
        body: JSON.stringify({ name: row.sgName, departmentId: dept.id }),
      });
      state.subjectGrades.push(sg);
    }
    const created = await api('/admin/classes', {
      method: 'POST',
      body: JSON.stringify({ name: row.className, teacherId: row.teacher.id, subjectGradeId: sg.id }),
    });
    created.teacher = { id: row.teacher.id, user: row.teacher.user };
    created.subjectGrade = { id: sg.id, name: sg.name };
    created._count = { enrollments: 0, assignments: 0 };
    state.classes.push(created);
    itemEl.classList.add('done');
    btn.textContent = 'Imported ✓';
    render();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Import';
    itemEl.appendChild(h(`<div class="form-error" style="margin-top:8px; width:100%;">${esc(err.message)}</div>`));
  }
}

function renderLogin(errorMsg) {
  app.innerHTML = '';
  const box = h(`
    <div id="login-screen" class="card">
      <h1 class="page-title" style="margin-bottom: 4px;">Vanilla Admin</h1>
      <div class="page-sub">Log in to run the 2026 class import</div>
      ${errorMsg ? `<div class="alert alert-danger">${esc(errorMsg)}</div>` : ''}
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" name="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" style="width: 100%;">Log in</button>
      </form>
    </div>
  `);
  box.querySelector('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const email = form.email.value.trim();
    const password = form.password.value;
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';
    try {
      const result = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      if (result.user.role !== 'ADMIN') {
        throw new Error('This tool requires an admin account.');
      }
      state.user = result.user;
      await boot();
    } catch (err) {
      renderLogin(err.message);
    }
  });
  app.appendChild(box);
}

async function boot() {
  app.innerHTML = `<div class="loading-center"><div class="spinner"></div><div>Loading class data…</div></div>`;
  try {
    await loadAll();
    render();
  } catch (err) {
    app.innerHTML = `<div class="alert alert-danger">Failed to load data: ${esc(err.message)}</div>`;
  }
}

document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'logout-btn') {
    api('/auth/logout', { method: 'POST' }).finally(() => { state.user = null; renderLogin(); });
  }
});

renderLogin();
</script>
</body>
</html>

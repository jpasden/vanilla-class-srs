services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanilla_class_srs
      POSTGRES_USER: ${POSTGRES_USER:-srs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
